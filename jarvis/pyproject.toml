[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "Fully local JARVIS-inspired desktop assistant"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "JARVIS" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "websockets>=12",
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2",
  "psutil>=5.9",
  "pillow>=10",
  "platformdirs>=4",
]

[project.optional-dependencies]
voice = ["sounddevice", "faster-whisper", "vosk", "pyttsx3"]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
